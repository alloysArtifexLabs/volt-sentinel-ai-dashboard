[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voltsentinel"
version = "0.2.0"
description = "AI-powered energy monitoring dashboard for industrial device fleets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.48",
    "pandas>=2.0",
    "plotly>=5.19",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
